<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NSS Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
<link rel="stylesheet" href="css/admin.css"/>
</head>
<body>

<!-- ══ SIDEBAR ══════════════════════════════════════════════════ -->
<aside id="sidebar">
  <div class="sb-logo">
    <div class="sb-icon">⚡</div>
    <div>
      <div class="sb-title">NSS Admin</div>
      <div class="sb-sub">Unit D-58</div>
    </div>
  </div>

  <nav id="nav">
    <button class="nav-btn active" data-tab="dashboard"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></button>
    <button class="nav-btn" data-tab="activities" id="tab-activities"><span class="nav-icon">📅</span><span class="nav-label">Activities</span></button>
    <button class="nav-btn" data-tab="attendance" id="tab-attendance"><span class="nav-icon">✅</span><span class="nav-label">Attendance</span></button>
    <button class="nav-btn" data-tab="volunteers" id="tab-volunteers"><span class="nav-icon">👥</span><span class="nav-label">Volunteers</span></button>
    <button class="nav-btn" data-tab="marks" id="tab-marks"><span class="nav-icon">📝</span><span class="nav-label">Marks</span></button>
    <button class="nav-btn" data-tab="settings" id="tab-settings"><span class="nav-icon">⚙️</span><span class="nav-label">Settings</span></button>
  </nav>

  <div class="sb-bottom">
    <button class="collapse-btn" id="collapseBtn">
      <span id="collapseArrow">◀</span>
      <span class="collapse-lbl">Collapse</span>
    </button>

    <button class="logout-btn" onclick="openModal('logoutModal')">
      <span>🚪</span>
      <span class="logout-lbl">Logout</span>
    </button>
  </div>
</aside>

<!-- ══ MAIN ════════════════════════════════════════════════════ -->
<div id="main">

  <header>
    <div>
      <div class="hdr-title" id="hdrTitle">Dashboard</div>
      <div class="hdr-sub">KBP College Vashi · NSS D-58</div>
    </div>

    <div class="hdr-right">
      <button class="notif-btn">
        🔔
        <span class="notif-badge">3</span>
      </button>

      <div style="display:flex;align-items:center;gap:10px;">
        <div class="avatar">A</div>

        <div>
          <div class="admin-name">Admin</div>
          <div class="admin-role">Programme Officer</div>
        </div>
      </div>
    </div>
  </header>

  <main>

    <!-- DASHBOARD -->
    <div class="tab active" id="tab-dashboard">
      <div class="page-title">Welcome back, Admin 👋</div>
      <div class="page-sub">NSS Unit D-58 · KBP College, Vashi</div>

      <div class="cards" id="dash-cards"></div>

      <div class="quick-acts">
        <button class="btn btn-blue" onclick="switchTab('activities')">+ New Activity</button>
        <button class="btn btn-green" onclick="switchTab('attendance')">▶ Start Attendance</button>
        <button class="btn btn-purple" onclick="switchTab('marks')">✏️ Assign Marks</button>
      </div>

      <div class="tbl-wrap">
        <div class="tbl-head">Recent Activities</div>

        <table>
          <thead>
            <tr>
              <th>ACTIVITY</th>
              <th>DATE</th>
              <th>STATUS</th>
            </tr>
          </thead>

          <tbody id="dash-recent"></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- TOAST -->
<div id="toast-container"></div>

<!-- MODALS -->
<div class="modal-overlay" id="logoutModal">
  <div class="modal-box">
    <h3>Logout?</h3>

    <p>Are you sure you want to logout from admin panel?</p>

    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('logoutModal')">Cancel</button>
      <button class="btn btn-red">Logout</button>
    </div>
  </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
